[project]
name = "testcase-cs2"
version = "0.1.0"
description = "CS2 utility analytics POC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.0,<4.0",
    "numpy>=2.5,<3.0",
    "matplotlib>=3.11,<4.0",
    "seaborn>=0.13,<0.14",
    "scikit-learn>=1.9,<2.0",
    "scipy>=1.18,<2.0",
    "pyarrow>=26.0,<27.0",
    "pymongo>=4.19,<5.0",
    "jupyter>=1.1,<2.0",
    "ipykernel>=7.4,<8.0",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
